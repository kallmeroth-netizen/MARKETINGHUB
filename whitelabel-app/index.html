<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sign in — {{BRAND}}</title>
<meta name="theme-color" content="#0071e3">
<link rel="stylesheet" href="theme.css">

<!-- Brand engine -->
<script src="brand.default.js"></script>
<script src="brand-config.js"></script>
<script>
  // First-run gate: if the wizard hasn't been completed, go set up the hub.
  (function () {
    try {
      if (window.Brand && !window.Brand.isSetupComplete()) {
        window.location.replace('setup.html');
      }
    } catch (e) {}
  })();
</script>
<script src="brand-apply.js" defer></script>
<script src="chrome-v2.js" defer></script>

<style>
  body { background:var(--bg,#f5f5f7); color:var(--ink,#1d1d1f); font-family:var(--f-sans); min-height:100vh; overflow-x:hidden; }
  body[data-state="passcode"] .hub-shell { display:none; }
  body[data-state="hub"] .pass-shell { display:none; }

  /* Apple base is a clean, flat light-gray canvas — no colored blur blobs. */
  .blob { display:none; }

  /* ---------- passcode ---------- */
  .pass-shell { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; }
  .pass-logo { position:absolute; top:40px; left:50%; transform:translateX(-50%); }
  .pass-logo img { width:150px; height:auto; display:block; }
  .pass-hero { display:flex; flex-direction:column; align-items:center; gap:14px; width:min(420px,100%); }
  .greeting { font-family:var(--f-display); font-weight:600; letter-spacing:-0.02em; font-size:clamp(30px,4.6vw,46px); line-height:1; color:var(--ink,#1d1d1f); text-align:center; min-height:1em; }
  .greeting .cursor { display:inline-block; width:2px; height:1em; background:var(--brand-orange,#4f46e5); margin-left:3px; vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .sub-pass { font-size:14px; color:var(--text-2,#3a3d44); opacity:0; transition:opacity .5s; }
  .sub-pass.shown { opacity:1; }
  .divider-pass { width:44px; height:2px; background:var(--line-strong,rgba(31,35,40,0.12)); border-radius:2px; margin:4px 0 6px; }
  .capsule-wrap { width:100%; }
  .capsule { display:flex; align-items:center; gap:8px; background:var(--surface,#fff); border:1.5px solid var(--line-strong,rgba(31,35,40,0.12)); border-radius:100px; padding:6px 8px 6px 16px; transition:border-color .2s; }
  .capsule:focus-within { border-color:var(--brand-orange,#4f46e5); }
  .capsule.error { border-color:#d85c3a; }
  .lock-ico { color:var(--text-3,#7a7770); display:flex; }
  .pw-input { flex:1; border:none; outline:none; background:none; font-family:inherit; font-size:14.5px; color:var(--ink,#1d1d1f); padding:8px 0; }
  .toggle-vis { background:none; border:none; color:var(--text-3,#7a7770); cursor:pointer; display:flex; padding:6px; }
  .submit { border:none; border-radius:100px; background:var(--brand-orange,#4f46e5); color:#fff; font-family:inherit; font-weight:600; font-size:13px; padding:9px 18px; cursor:pointer; white-space:nowrap; transition:filter .2s; }
  .submit:hover { filter:brightness(1.06); }
  .err { font-size:12.5px; color:#8a3518; text-align:center; opacity:0; height:0; transition:opacity .2s; }
  .err.show { opacity:1; height:auto; margin-top:4px; }

  /* ---------- hub ---------- */
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:12px clamp(16px,4vw,40px); background:rgba(255,255,255,0.82); backdrop-filter:blur(14px); border-bottom:1px solid var(--line,rgba(31,35,40,0.06)); }
  .nav-brand { display:flex; align-items:center; gap:7px; cursor:pointer; }
  .nav-brand img { height:28px; width:auto; }
  .nav-brand .chev { width:16px; height:16px; color:var(--text-3,#7a7770); transition:transform .3s; }
  .nav-brand.open .chev { transform:rotate(180deg); }
  .nav-right { display:flex; align-items:center; gap:12px; }
  .date-chip { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2,#3a3d44); background:var(--surface,#fff); border:1px solid var(--line-strong,rgba(31,35,40,0.1)); border-radius:100px; padding:6px 12px; }

  .hub-overlay { position:fixed; inset:0; background:rgba(31,35,40,0.28); opacity:0; pointer-events:none; transition:opacity .25s; z-index:25; }
  .hub-overlay.open { opacity:1; pointer-events:auto; }
  .hub-pop { position:fixed; top:64px; left:50%; transform:translateX(-50%) translateY(-8px); width:min(720px,94vw); background:var(--surface,#fff); border:1px solid var(--line-strong,rgba(31,35,40,0.1)); border-radius:20px; box-shadow:0 30px 70px rgba(0,0,0,0.18); padding:18px; opacity:0; pointer-events:none; transition:.25s; z-index:26; }
  .hub-pop.open { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  .hub-label { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3,#7a7770); padding:2px 6px 12px; }
  .hub-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .hub-card { display:flex; flex-direction:column; gap:6px; padding:14px; border-radius:14px; border:1px solid var(--line,rgba(31,35,40,0.07)); text-decoration:none; color:var(--ink,#1d1d1f); transition:.18s; }
  .hub-card:hover { border-color:var(--line-bold,rgba(31,35,40,0.18)); transform:translateY(-1px); }
  .hub-card.active { border-color:var(--brand-orange,#4f46e5); }
  .hub-card-icon { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; }
  .hub-card-icon svg { width:18px; height:18px; }
  .hub-card-title { font-size:13px; font-weight:600; }
  .hub-card-sub { font-size:11px; color:var(--text-3,#7a7770); }

  main { max-width:1040px; margin:0 auto; padding:clamp(28px,6vw,64px) clamp(16px,4vw,40px); position:relative; z-index:1; }
  .hero-greet { font-family:var(--f-display); font-weight:600; letter-spacing:-0.02em; font-size:clamp(28px,5vw,44px); line-height:1.05; }
  .hero-sub { font-size:15px; color:var(--text-2,#3a3d44); margin-top:6px; }
  .hero-divider { width:52px; height:2px; background:var(--line-strong,rgba(31,35,40,0.12)); border-radius:2px; margin:22px 0 26px; }
  .tile-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .tile { display:flex; align-items:center; gap:14px; padding:18px; border-radius:18px; background:var(--surface,#fff); border:1px solid var(--line,rgba(31,35,40,0.07)); text-decoration:none; color:var(--ink,#1d1d1f); transition:.18s; }
  .tile:hover { transform:translateY(-2px); border-color:var(--line-bold,rgba(31,35,40,0.18)); box-shadow:0 12px 28px rgba(0,0,0,0.06); }
  .tile-ico { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--surface-2,#f0eee9); color:var(--brand-orange,#4f46e5); flex-shrink:0; }
  .tile-ico svg { width:22px; height:22px; }
  .tile-label { display:block; font-size:15px; font-weight:600; }
  .tile-sub { display:block; font-size:12.5px; color:var(--text-3,#7a7770); }
  .signout { background:none; border:1.5px solid var(--line-strong,rgba(31,35,40,0.15)); border-radius:100px; padding:7px 14px; font-family:var(--f-sans); font-weight:600; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-2,#3a3d44); cursor:pointer; }

  /* ---------- branded sweep transition (login → hub) ---------- */
  .sweep {
    position:fixed; inset:0; z-index:60; pointer-events:none;
    background:var(--brand-orange,#5b6cff);
    transform:translateY(100%);
    display:flex; align-items:center; justify-content:center;
  }
  .sweep-text {
    font-family:var(--f-sans); font-weight:600;
    letter-spacing:.32em; text-transform:uppercase; font-size:15px;
    color:#fff; opacity:0;
  }
  .sweep.in  { animation:sweepIn .52s cubic-bezier(.76,0,.24,1) forwards; }
  .sweep.in .sweep-text { animation:sweepLabel .52s ease forwards; }
  .sweep.out { animation:sweepOut .52s cubic-bezier(.76,0,.24,1) forwards; }
  @keyframes sweepIn  { from{transform:translateY(100%)} to{transform:translateY(0)} }
  @keyframes sweepOut { from{transform:translateY(0)} to{transform:translateY(-100%)} }
  @keyframes sweepLabel { 0%{opacity:0} 40%{opacity:1} 100%{opacity:1} }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="np-data.js"></script>
</head>
<body data-state="passcode">

<div class="blob b1"></div>
<div class="blob b2"></div>

<!-- Branded reveal transition: sweeps up in the primary color on sign-in -->
<div class="sweep" id="sweep"><div class="sweep-text" data-brand-name>Your Brand</div></div>

<!-- ==================== PASSCODE ==================== -->
<div class="pass-shell" id="passShell">
  <div class="pass-logo"><img data-brand-logo src="assets/placeholder-logo.svg" alt="Brand"></div>
  <div class="pass-hero">
    <div class="greeting"><span id="greetText"></span><span class="cursor"></span></div>
    <div class="sub-pass" id="subPass">Sign in to continue.</div>
    <div class="divider-pass"></div>
    <div class="capsule-wrap" style="display:flex;flex-direction:column;gap:8px">
      <div class="capsule" id="emailCapsule">
        <span class="lock-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8l9 6 9-6"/></svg></span>
        <input id="em" class="pw-input" type="email" placeholder="Email" autocomplete="email" autocapitalize="off" spellcheck="false">
      </div>
      <div class="capsule" id="capsule">
        <span class="lock-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input id="pw" class="pw-input" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
        <button class="toggle-vis" id="toggleVis" type="button" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="submit" id="go" type="button">Enter →</button>
      </div>
      <div class="err" id="err">Invalid email or password.</div>
    </div>
  </div>
</div>

<!-- ==================== HUB ==================== -->
<div class="hub-shell" id="hubShell">
  <nav class="topbar">
    <div class="nav-brand" id="navBrand" onclick="toggleHubNav(event)">
      <img data-brand-logo src="assets/placeholder-logo.svg" alt="Brand">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="nav-right">
      <div class="date-chip"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg><span id="dateText">—</span></div>
      <button class="signout" type="button" onclick="NPData.signOut()">Sign out</button>
    </div>
  </nav>

  <div class="hub-overlay" id="hubOverlay"></div>
  <div class="hub-pop np-hub" id="hubPop">
    <div class="hub-label np-hub-label">{{BRAND}} Marketing Hub</div>
    <div class="hub-grid hub-nav-grid" id="hubGrid"></div>
  </div>

  <main>
    <div class="hero-greet"><span id="heroGreet">Good day</span></div>
    <div class="hero-sub">Welcome to your <span data-brand-tagline>Marketing Hub</span></div>
    <div class="hero-divider"></div>
    <div class="tile-grid" id="tileGrid"></div>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* ---------- greeting typing ---------- */
  var greetEl = document.getElementById('greetText');
  function typeText(el, text, speed, done) {
    el.textContent = ''; var i = 0;
    (function step(){ if (i < text.length) { el.textContent += text[i++]; setTimeout(step, speed); } else if (done) done(); })();
  }
  var OPENING = (window.Brand.get().greeting || 'Welcome back.');
  setTimeout(function () {
    typeText(greetEl, OPENING, 90, function () { setTimeout(function () { document.getElementById('subPass').classList.add('shown'); }, 200); });
  }, 500);

  function timeGreeting() {
    var h = new Date().getHours();
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  }

  /* ---------- login ---------- */
  var em = document.getElementById('em'), pw = document.getElementById('pw');
  var cap = document.getElementById('capsule'), err = document.getElementById('err');

  function clearError(){ cap.classList.remove('error'); err.classList.remove('show'); }
  em.addEventListener('input', clearError);
  pw.addEventListener('input', clearError);
  document.getElementById('toggleVis').addEventListener('click', function(){ pw.type = pw.type === 'password' ? 'text' : 'password'; });

  async function submitLogin() {
    var email = em.value.trim(), pass = pw.value;
    if (!email || !pass) { cap.classList.add('error'); err.classList.add('show'); return; }
    var go = document.getElementById('go'); go.disabled = true; go.textContent = '…';
    var res = await NPData.signIn(email, pass);
    go.disabled = false; go.textContent = 'Enter →';
    if (res.error) { cap.classList.add('error'); err.textContent = res.error.message || 'Invalid email or password.'; err.classList.add('show'); return; }
    enterHub(true);
  }
  document.getElementById('go').addEventListener('click', submitLogin);
  pw.addEventListener('keydown', function(e){ if (e.key === 'Enter') submitLogin(); });
  em.addEventListener('keydown', function(e){ if (e.key === 'Enter') pw.focus(); });

  /* ---------- hub ---------- */
  // Canonical tiles (mirror chrome-v2.js HUB_ITEMS) filtered by role.
  var TILES = [
    { key:'sales',    roles:['team','guest','admin'], href:'dashboard.html',              label:'Performance Marketing', sub:'Weekly & all-time KPIs', svg:'<path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/>' },
    { key:'pmix',     roles:['team','guest','admin'], href:'pmix.html',     label:'Sales & Pmix',          sub:'Daily sales & product mix', svg:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>' },
    { key:'calendar', roles:['team','guest','admin'], href:'calendar.html', label:'Marketing Calendar',    sub:'Campaigns & scheduling', svg:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>' },
    { key:'assets',   roles:['team','guest','admin'], href:'assets.html',   label:'Brand Assets',          sub:'Logos & templates', svg:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>' },
    { key:'admin',    roles:['admin'],                href:'admin.html',                  label:'Admin',                 sub:'Users & setup', svg:'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/><path d="M18 14l1.5 1.5L22 13"/>' }
  ];

  function renderTiles(role) {
    var vis = TILES.filter(function(t){ return t.roles.indexOf(role) !== -1; });
    document.getElementById('tileGrid').innerHTML = vis.map(function(t){
      return '<a class="tile" href="' + t.href + '">' +
        '<span class="tile-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + t.svg + '</svg></span>' +
        '<span><span class="tile-label">' + t.label + '</span><span class="tile-sub">' + t.sub + '</span></span></a>';
    }).join('');
  }

  async function enterHub(animate) {
    var role = 'team';
    try { role = (await NPData.getRole()) || 'team'; } catch (e) {}
    renderTiles(role);
    document.getElementById('heroGreet').textContent = timeGreeting();
    document.getElementById('dateText').textContent = new Date().toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });

    function reveal() {
      document.body.setAttribute('data-state', 'hub');
      // brand-apply re-brands the hub logo/labels now that they're visible.
      try { window.dispatchEvent(new CustomEvent('brand:changed', { detail: window.Brand.get() })); } catch (e) {}
    }

    if (animate) {
      // Branded sweep: primary-colored panel rises to cover, we swap the
      // view underneath, then it continues up and off — a seamless reveal.
      var sweep = document.getElementById('sweep');
      sweep.className = 'sweep in';
      setTimeout(function () {
        reveal();
        sweep.className = 'sweep out';
        setTimeout(function () { sweep.className = 'sweep'; }, 560);
      }, 520);
    } else {
      reveal();
    }
  }

  // hub dropdown open/close (chrome-v2 also wires the brand click)
  var overlay = document.getElementById('hubOverlay'), pop = document.getElementById('hubPop');
  window.toggleHubNav = function (e) {
    if (e && e.preventDefault) e.preventDefault();
    var open = !pop.classList.contains('open');
    pop.classList.toggle('open', open); overlay.classList.toggle('open', open);
    document.getElementById('navBrand').classList.toggle('open', open);
    if (open) {
      // populate the dropdown grid too
      NPData.getRole().then(function(r){ renderHubGrid(r || 'team'); });
    }
  };
  overlay.addEventListener('click', function(){ window.toggleHubNav(); });

  function renderHubGrid(role) {
    var vis = TILES.filter(function(t){ return t.roles.indexOf(role) !== -1; });
    document.getElementById('hubGrid').innerHTML = vis.map(function(t){
      return '<a class="hub-card" href="' + t.href + '">' +
        '<span class="hub-card-icon" style="background:var(--surface-2,#f0eee9);color:var(--brand-orange,#4f46e5)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + t.svg + '</svg></span>' +
        '<span class="hub-card-title">' + t.label + '</span><span class="hub-card-sub">' + t.sub + '</span></a>';
    }).join('');
  }

  /* ---------- resume an existing session ---------- */
  (async function () {
    try {
      if (NPData.isConfigured()) {
        var s = await NPData.getSession();
        if (s) { enterHub(false); }
      }
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
