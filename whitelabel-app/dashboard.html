<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Performance Marketing — {{BRAND}}</title>
<meta name="theme-color" content="#4f46e5">
<link rel="stylesheet" href="theme.css">

<script src="brand.default.js"></script>
<script src="brand-config.js"></script>
<script src="brand-apply.js" defer></script>
<script src="chrome-v2.js" defer></script>

<style>
  body { background:var(--bg,#f6f6f8); color:var(--text,#1f2328); font-family:'DM Sans',sans-serif; }
  .wrap { max-width:1040px; margin:0 auto; padding:28px 20px 80px; }
  .page-h { font-size:24px; font-weight:700; margin:0 0 4px; }
  .page-sub { font-size:13.5px; color:var(--text-2,#3a3d44); margin:0 0 26px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; margin-bottom:26px; }
  .kpi { background:var(--surface,#fff); border:1px solid var(--line,rgba(31,35,40,0.07)); border-radius:16px; padding:18px 20px; }
  .kpi .k-label { font-size:12px; font-weight:600; color:var(--text-3,#7a7770); text-transform:uppercase; letter-spacing:.06em; }
  .kpi .k-val { font-size:30px; font-weight:700; margin-top:8px; color:var(--text-mute,#c0bdb7); }
  .kpi .k-note { font-size:11.5px; color:var(--text-3,#7a7770); margin-top:6px; }
  .empty {
    background:var(--surface,#fff); border:1.5px dashed var(--line-strong,rgba(31,35,40,0.16));
    border-radius:18px; padding:44px 28px; text-align:center;
  }
  .empty .ic { width:52px; height:52px; border-radius:14px; background:var(--surface-2,#f0eee9); display:grid; place-items:center; margin:0 auto 16px; color:var(--brand-orange,#4f46e5); }
  .empty h3 { font-size:17px; font-weight:700; margin:0 0 6px; }
  .empty p { font-size:13.5px; color:var(--text-2,#3a3d44); max-width:420px; margin:0 auto 18px; line-height:1.55; }
  .empty a { display:inline-block; padding:11px 22px; border-radius:100px; background:var(--brand-orange,#4f46e5); color:#fff; font-size:13px; font-weight:600; text-decoration:none; }
</style>
</head>
<body data-page-tag="Performance">

<div id="np-nav-placeholder"></div>

<div class="wrap">
  <h1 class="page-h">Performance Marketing</h1>
  <p class="page-sub">Weekly &amp; all-time KPIs · <span data-brand-name>Your Brand</span></p>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="empty">
    <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></div>
    <h3>No data yet</h3>
    <p id="emptyMsg">Connect a data source to populate your performance dashboard. Once a source is linked, weekly and all-time KPIs will appear here automatically.</p>
    <a href="setup.html">Connect a data source →</a>
  </div>
</div>

<script>
  // KPI shells — deliberately empty. Values render from data/*.json, which
  // ship as empty scaffolds so no numbers are shown until a brand connects
  // their own backend.
  var KPIS = [
    { label:'Net Sales',        note:'This week' },
    { label:'Check Count',      note:'This week' },
    { label:'Avg Check',        note:'This week' },
    { label:'Social Reach',     note:'Last 28 days' },
    { label:'Review Score',     note:'All sources' },
    { label:'Ad Spend',         note:'This week' }
  ];
  document.getElementById('kpiGrid').innerHTML = KPIS.map(function(k){
    return '<div class="kpi"><div class="k-label">' + k.label + '</div><div class="k-val">—</div><div class="k-note">' + k.note + ' · no data</div></div>';
  }).join('');

  // Attempt to read the (empty) data scaffold; stays empty by design.
  fetch('data/daily-data.json').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    if (!d || !d.rows || !d.rows.length) return; // empty scaffold → keep empty states
    // (Real rendering would populate KPIs here once a source is connected.)
  }).catch(function(){});
</script>
</body>
</html>
