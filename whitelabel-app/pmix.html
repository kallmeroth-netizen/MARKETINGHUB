<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sales &amp; Pmix — {{BRAND}}</title>
<meta name="theme-color" content="#0071e3">
<link rel="stylesheet" href="theme.css">

<script src="brand.default.js"></script>
<script src="brand-config.js"></script>
<script src="hub-modules.js"></script>
<script src="brand-apply.js" defer></script>
<script src="chrome-v2.js" defer></script>

<style>
  body { background:var(--bg,#f5f5f7); color:var(--text,#1d1d1f); font-family:var(--f-sans); }
  .wrap { max-width:1040px; margin:0 auto; padding:28px 20px 80px; }
  .page-h { font-size:26px; font-weight:700; letter-spacing:-0.02em; margin:0 0 4px; }
  .page-sub { font-size:13.5px; color:var(--text-2,#424245); margin:0 0 26px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; margin-bottom:22px; }
  .kpi { background:var(--surface,#fff); border:1px solid var(--line,rgba(0,0,0,0.06)); border-radius:18px; padding:18px 20px; box-shadow:var(--shadow-sm); }
  .kpi .k-label { font-size:12px; font-weight:600; color:var(--text-3,#6e6e73); text-transform:uppercase; letter-spacing:.06em; }
  .kpi .k-val { font-size:30px; font-weight:700; letter-spacing:-0.02em; margin-top:8px; color:var(--text-mute,#aeaeb2); }
  .kpi .k-note { font-size:11.5px; color:var(--text-3,#6e6e73); margin-top:6px; }
  .panel { background:var(--surface,#fff); border:1px solid var(--line,rgba(0,0,0,0.06)); border-radius:18px; padding:22px; box-shadow:var(--shadow-sm); margin-bottom:22px; }
  .panel h2 { font-size:15px; font-weight:600; margin:0 0 14px; }
  .mix-row { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line,rgba(0,0,0,0.05)); }
  .mix-row:last-child { border-bottom:none; }
  .mix-bar { flex:1; height:8px; border-radius:100px; background:var(--surface-2,#f5f5f7); }
  .mix-name { width:150px; font-size:13px; color:var(--text-3,#6e6e73); }
  .mix-val { width:60px; text-align:right; font-size:13px; color:var(--text-mute,#aeaeb2); }
  .empty { background:var(--surface,#fff); border:1px solid var(--line,rgba(0,0,0,0.06)); border-radius:20px; padding:44px 28px; text-align:center; box-shadow:var(--shadow-sm); }
  .empty .ic { width:52px; height:52px; border-radius:15px; background:var(--surface-2,#f5f5f7); display:grid; place-items:center; margin:0 auto 16px; color:var(--brand-orange,#0071e3); }
  .empty h3 { font-size:18px; font-weight:600; letter-spacing:-0.01em; margin:0 0 6px; }
  .empty p { font-size:14px; color:var(--text-2,#424245); max-width:440px; margin:0 auto 18px; line-height:1.55; }
  .empty a { display:inline-block; padding:11px 22px; border-radius:100px; background:var(--brand-orange,#0071e3); color:#fff; font-size:14px; font-weight:500; text-decoration:none; box-shadow:var(--shadow-orange); }
</style>
</head>
<body data-page-tag="Sales & Pmix">

<div id="np-nav-placeholder"></div>

<div class="wrap">
  <h1 class="page-h">Sales &amp; Pmix</h1>
  <p class="page-sub">Daily sales &amp; product mix · <span data-brand-name>Your Brand</span></p>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="panel">
    <h2>Product mix</h2>
    <div id="mixRows"></div>
  </div>

  <div class="empty">
    <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
    <h3>No sales data yet</h3>
    <p>Connect your point-of-sale to see daily net sales, check counts and your full product mix here — the layout stays exactly as it is now, just populated.</p>
    <a href="setup.html">Connect Toast →</a>
  </div>
</div>

<script>
  var KPIS = [
    { label:'Net Sales',  note:'Today' },
    { label:'Items Sold', note:'Today' },
    { label:'Avg Check',  note:'Today' },
    { label:'Top Category', note:'Today' }
  ];
  document.getElementById('kpiGrid').innerHTML = KPIS.map(function(k){
    return '<div class="kpi"><div class="k-label">' + k.label + '</div><div class="k-val">—</div><div class="k-note">' + k.note + ' · no data</div></div>';
  }).join('');

  // Empty product-mix skeleton rows (structure with no numbers).
  var SLOTS = ['Category 1','Category 2','Category 3','Category 4','Category 5'];
  document.getElementById('mixRows').innerHTML = SLOTS.map(function(s){
    return '<div class="mix-row"><div class="mix-name">' + s + '</div><div class="mix-bar"></div><div class="mix-val">—</div></div>';
  }).join('');
</script>
</body>
</html>
